name: Release

# Pushing a tag like v0.1.0 tests the code, builds QuickFixAI.exe on GitHub's own runner and attaches it
# to a release, so anyone can see exactly how the download was made.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name QuickFixAI --icon assets\icon.ico run.pyw
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\QuickFixAI.exe --title "QuickFix AI ${{ github.ref_name }}" --generate-notes
